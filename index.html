<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kommunikationshilfe</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f6f2;
  color:#111;
}

header{
  background:#397d76;
  color:white;
  text-align:center;
  padding:28px 15px;
}

.logo{
  font-size:64px;
  line-height:1;
}

header h1{
  margin:10px 0 0;
  font-size:38px;
  font-weight:800;
}

main{
  max-width:900px;
  margin:auto;
  padding:30px 18px;
}

.intro{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

button{
  border:0;
  border-radius:22px;
  background:white;
  padding:22px 12px;
  min-height:130px;
  font-size:24px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.emoji{
  display:block;
  font-size:48px;
  margin-bottom:8px;
}

.speech{
  margin-top:25px;
  background:#397d76;
  color:white;
  width:100%;
  min-height:75px;
  font-size:25px;
}

.output{
  margin-top:20px;
  background:white;
  border-radius:20px;
  padding:20px;
  text-align:center;
  font-size:27px;
  font-weight:bold;
  min-height:70px;
  box-shadow:0 3px 10px rgba(0,0,0,.10);
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}

@media(max-width:600px){
  header h1{
    font-size:30px;
  }

  .intro{
    font-size:23px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  button{
    min-height:125px;
    font-size:20px;
  }

  .emoji{
    font-size:42px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">❤️</div>
  <h1>UNSERE KOMMUNIKATIONSHILFE</h1>
</header>

<main>

  <div class="intro">
    Was möchtest du mitteilen?
  </div>

  <div class="grid">

    <button onclick="sprechen('Ich möchte nach Hause.')">
      <span class="emoji">🏠</span>
      Nach Hause
    </button>

    <button onclick="sprechen('Ich habe Hunger.')">
      <span class="emoji">🍽️</span>
      Hunger
    </button>

    <button onclick="sprechen('Ich habe Durst.')">
      <span class="emoji">🥤</span>
      Durst
    </button>

    <button onclick="sprechen('Ich muss zur Toilette.')">
      <span class="emoji">🚽</span>
      Toilette
    </button>

    <button onclick="sprechen('Ich brauche Hilfe.')">
      <span class="emoji">🆘</span>
      Hilfe
    </button>

    <button onclick="sprechen('Ich habe Schmerzen.')">
      <span class="emoji">🤕</span>
      Schmerzen
    </button>

    <button onclick="sprechen('Mir geht es gut.')">
      <span class="emoji">😊</span>
      Gut
    </button>

    <button onclick="sprechen('Mir geht es nicht gut.')">
      <span class="emoji">😟</span>
      Nicht gut
    </button>

    <button onclick="sprechen('Ja.')">
      <span class="emoji">👍</span>
      Ja
    </button>

    <button onclick="sprechen('Nein.')">
      <span class="emoji">👎</span>
      Nein
    </button>

    <button onclick="sprechen('Ich möchte etwas trinken.')">
      <span class="emoji">💧</span>
      Trinken
    </button>

    <button onclick="sprechen('Ich möchte etwas essen.')">
      <span class="emoji">🍎</span>
      Essen
    </button>

  </div>

  <div id="ausgabe" class="output">
    Wähle eine Aussage aus.
  </div>

  <button class="speech" onclick="nochmalSprechen()">
    🔊 Nochmal vorlesen
  </button>

</main>

<footer>
  Unsere Kommunikationshilfe ❤️
</footer>

<script>

let letzterText = "";

function sprechen(text){

  letzterText = text;

  document.getElementById("ausgabe").textContent = text;

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

    const stimme = new SpeechSynthesisUtterance(text);

    stimme.lang = "de-DE";
    stimme.rate = 0.9;
    stimme.pitch = 1;

    window.speechSynthesis.speak(stimme);
  }
}

function nochmalSprechen(){

  if(letzterText !== ""){
    sprechen(letzterText);
  }

}

</script>
<img src="IMG-20260809-WA0014.jpg" alt="Bonitas Logo">
</body>
</html>
