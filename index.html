<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unsere Kommunikationshilfe</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f6f2;
  color:#111;
}

header{
  width:100%;
  background:#397d76;
  color:white;
  text-align:center;
  padding:28px 15px 32px;
}

.logo{
  font-size:64px;
  line-height:1;
  margin-bottom:12px;
}

header h1{
  margin:0;
  font-size:34px;
  line-height:1.15;
  font-weight:800;
}

main{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:35px 18px 50px;
}

h2{
  text-align:center;
  margin:0 0 28px;
  font-size:30px;
  line-height:1.2;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  background:white;
  border:3px solid #d8d6ce;
  border-radius:28px;
  padding:25px 18px;
  text-align:center;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  color:#111;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.card:active{
  transform:scale(.98);
}

.icon{
  font-size:65px;
  line-height:1;
  margin-bottom:15px;
}

.card h3{
  margin:0;
  font-size:27px;
  font-weight:800;
}

.info{
  margin-top:30px;
  text-align:center;
  color:#666;
  font-size:20px;
  line-height:1.4;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:16px;
}

@media (max-width:600px){

  header{
    padding:25px 10px 30px;
  }

  .logo{
    font-size:58px;
  }

  header h1{
    font-size:32px;
  }

  main{
    padding:30px 14px 40px;
  }

  h2{
    font-size:28px;
    margin-bottom:24px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:16px;
  }

  .card{
    min-height:165px;
    padding:22px 15px;
  }

  .icon{
    font-size:58px;
  }

  .card h3{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">❤️</div>
  <h1>UNSERE<br>KOMMUNIKATIONSHILFE</h1>
</header>

<main>

  <h2>Was möchtest du<br>mitteilen?</h2>

  <div class="grid">

    <a class="card" href="#">
      <div class="icon">🏠</div>
      <h3>HAUSHALT</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">🧹</div>
      <h3>ORDNUNG</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">🔊</div>
      <h3>LAUTSTÄRKE</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">🕐</div>
      <h3>RUHEZEIT</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">💶</div>
      <h3>GELD</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">🛒</div>
      <h3>EINKAUF</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">👥</div>
      <h3>BESUCH</h3>
    </a>

    <a class="card" href="#">
      <div class="icon">💬</div>
      <h3>SONSTIGES</h3>
    </a>

  </div>

  <div class="info">
    Gemeinsam sprechen. Gemeinsam Lösungen finden.
  </div>

</main>

<footer>
  Unsere WG-Kommunikationshilfe ❤️
</footer>

</body>
</html>
