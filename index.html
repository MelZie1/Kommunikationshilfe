<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Unsere Kommunikationshilfe</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f6f2;
  color:#111;
}

header{
  background:#397d76;
  color:white;
  text-align:center;
  padding:28px 15px;width:100vw;
}

.logo{
  font-size:58px;
  line-height:1;
}

header h1{
  margin:8px 0 0;
  font-size:32px;
  font-weight:800;
}

main{
  max-width:900px;
  margin:0 auto;
  padding:45px 25px;
}

h2{
  text-align:center;
  font-size:42px;
  margin:0 0 45px;
}

.grid{
  display:grid;
  gap:28px;
}

.card{
  background:white;
  border:6px solid #d8d5ca;
  border-radius:42px;
  padding:35px 20px;
  text-align:center;
  cursor:pointer;
  transition:transform .15s;
}

.card:active{
  transform:scale(.97);
}

.card.health{
  background:#fff5f4;
  border-color:#df716d;
}

.icon{
  font-size:82px;
  line-height:1;
  margin-bottom:20px;
}

.card h3{
  margin:0;
  font-size:32px;
  font-weight:800;
}

.info{
  text-align:center;
  color:#666;
  font-size:24px;
  line-height:1.4;
  margin-top:40px;
}

@media(max-width:600px){
  header h1{
    font-size:36px;
  }

  h2{
    font-size:38px;
  }

  .card h3{
    font-size:29px;
  }

  .icon{
    font-size:72px;
  }

  .info{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">❤️</div>
  <h1>UNSERE<br>KOMMUNIKATIONSHILFE</h1>
</header>

<main>

<h2>Was möchtest du<br>mitteilen?</h2>

<div class="grid">

  <div class="card"
       onclick="sprechen('Normale Bedürfnisse')">
    <div class="icon">🏠</div>
    <h3>NORMALE BEDÜRFNISSE</h3>
  </div>

  <div class="card health"
       onclick="sprechen('Gesundheit und Schmerzen')">
    <div class="icon">🩺</div>
    <h3>GESUNDHEIT / SCHMERZEN</h3>
  </div>

</div>

<div class="info">
  Einfach auf ein Bild tippen.<br>
  Das Tablet spricht die Auswahl vor.
</div>

</main>

<script>
function sprechen(text){
  window.speechSynthesis.cancel();

  const aussage = new SpeechSynthesisUtterance(text);
  aussage.lang = "de-DE";
  aussage.rate = 0.9;
  aussage.volume = 1;

  window.speechSynthesis.speak(aussage);
}
</script>

</body>
</html>
